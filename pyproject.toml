[project]
name = "outreach"
version = "0.1.0"
description = "Local, approval-gated cold outreach for internship search"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.23",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outreach = "outreach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["outreach"]
